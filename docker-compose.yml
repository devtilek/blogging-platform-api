services:
  postgres:
    image: postgres:17-alpine
    container_name: blogging-platform-postgres
    environment:
      POSTGRES_DB: blogging_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogging_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: blogging-platform-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/blogging_platform
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
